<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:#081223;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;

}

.container{

width:900px;
background:#102542;
padding:35px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.35);

}

h2{

text-align:center;
color:white;
margin-bottom:30px;

}

.form-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;

}

.input-box{

display:flex;
flex-direction:column;

}

.input-box label{

color:#dbeafe;
margin-bottom:8px;
font-weight:600;

}

.input-box input,
.input-box select,
.input-box textarea{

padding:12px;
border:none;
border-radius:10px;
background:#1b3558;
color:white;
font-size:15px;
outline:none;

}

.input-box textarea{

resize:none;
height:90px;

}

.full{

grid-column:1/3;

}
/* ===========================
   Buttons
=========================== */

.buttons{

margin-top:30px;

display:flex;
justify-content:center;
gap:15px;

}

.save-btn{

background:#2563eb;
color:white;
padding:14px 30px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

.save-btn:hover{

background:#1d4ed8;

}

.back-btn{

background:#6b7280;
color:white;
padding:14px 30px;
border-radius:10px;
text-decoration:none;
font-weight:600;
transition:.3s;

}

.back-btn:hover{

background:#4b5563;

}

@media(max-width:768px){

.form-grid{

grid-template-columns:1fr;

}

.full{

grid-column:1;

}

.container{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<h2><i class="fas fa-user-plus"></i> Add New Student</h2>

<form method="POST" action="/add-student">

<div class="form-grid">

<div class="input-box">

<label>Registration Number</label>

<input type="text" name="reg_no" required>

</div>

<div class="input-box">

<label>Student Name</label>

<input type="text" name="name" required>

</div>

<div class="input-box">

<label>Father Name</label>

<input type="text" name="father" required>

</div>

<div class="input-box">

<label>Mother Name</label>

<input type="text" name="mother" required>

</div>

<div class="input-box">

<label>Blood Group</label>

<select name="blood_group" required>

<option value="">Select Blood Group</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="input-box">

<label>Age</label>

<input type="number" name="age" min="16" max="35" required>

</div>

<div class="input-box">

<label>Phone Number</label>

<input type="tel" name="phone" maxlength="10" required>

</div>

<div class="input-box">

<label>Email Address</label>

<input type="email" name="email" required>

</div>

<div class="input-box">

<label>Department</label>

<select name="department" required>

<option value="">Select Department</option>

<option>BCA</option>
<option>B.Sc CS</option>
<option>B.Com</option>
<option>BBA</option>
<option>BA English</option>
<option>MCA</option>

</select>

</div>

<div class="input-box">

<label>Year</label>

<select name="year" required>

<option value="">Select Year</option>

<option>I</option>
<option>II</option>
<option>III</option>

</select>

</div>

<div class="input-box full">

<label>Address</label>

<textarea name="address" required></textarea>

</div>
<div class="buttons">

<button type="submit" class="save-btn" id="saveBtn">

<i class="fas fa-save"></i> Save Student

</button>

<a href="/students" class="back-btn">

<i class="fas fa-arrow-left"></i> Back

</a>

</div>

</div>

</form>

</div>

<script>

const form=document.querySelector("form");
const btn=document.getElementById("saveBtn");

form.addEventListener("submit",function(){

btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving...';

btn.disabled=true;

});

</script>

</body>

</html>
