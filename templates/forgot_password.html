<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>

body{
font-family:Arial,sans-serif;
background:#081223;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#102542;
padding:35px;
border-radius:15px;
width:350px;
text-align:center;
color:white;
}

input{
width:100%;
padding:12px;
margin:15px 0;
border:none;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

a{
color:#60a5fa;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<p>Enter your registered email address</p>

<form method="POST">

<input
type="email"
name="email"
placeholder="Enter your Email"
required>

<button type="submit">
Send OTP
</button>

</form>

<br>

<a href="/">← Back to Login</a>

</div>

</body>
</html>
